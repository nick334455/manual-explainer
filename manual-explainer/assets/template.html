<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#eceae4; --text:#1c1c1a; --muted:#6a6862;
  --line:#dedbd2; --accent:#2c64d6; --accent-soft:#e3ebfb; --accent-ink:#ffffff;
  --warn-bg:#fff3dc; --warn-ink:#874f00; --ok:#1f7a45; --bad:#b3261e; --hl:#fff0a0; --hl-ink:#1c1c1a;
  --ask:#d9480f; --ask-ink:#ffffff; --shadow:0 6px 24px rgba(0,0,0,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131313; --surface:#1d1d1c; --surface2:#2a2a28; --text:#ecebe7; --muted:#a3a19a;
    --line:#383733; --accent:#7aa5ff; --accent-soft:#22304d; --accent-ink:#0d1220;
    --warn-bg:#3a2a10; --warn-ink:#ffcf86; --ok:#6fd49a; --bad:#ff8a80; --hl:#5a4a00; --hl-ink:#fff8d6;
    --ask:#ff8a4c; --ask-ink:#1a0a00; --shadow:0 6px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131313; --surface:#1d1d1c; --surface2:#2a2a28; --text:#ecebe7; --muted:#a3a19a;
  --line:#383733; --accent:#7aa5ff; --accent-soft:#22304d; --accent-ink:#0d1220;
  --warn-bg:#3a2a10; --warn-ink:#ffcf86; --ok:#6fd49a; --bad:#ff8a80; --hl:#5a4a00; --hl-ink:#fff8d6;
  --ask:#ff8a4c; --ask-ink:#1a0a00; --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.vpanel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:.6rem;width:min(360px,calc(100vw - 1.2rem));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:24;padding:.8rem;display:none}
.vpanel.open{display:block}
.vpanel h3{margin:0 0 .5rem;font-size:.95rem}
.vpanel label.row{display:flex;align-items:center;gap:.5rem;margin:.3rem 0 .6rem;font-size:.92rem}
.vpanel select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:.9rem;padding:0 .4rem}
.vpanel .vrow{display:flex;gap:.5rem;margin-top:.6rem}
.vpanel .vrow button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.vpanel .tip{margin-top:.6rem;font-size:.84rem;color:var(--warn-ink);background:var(--warn-bg);border-radius:10px;padding:.5rem .6rem}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{flex:1;min-width:0;margin:0;font-size:1rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;padding:0 .6rem;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
.iconbtn[aria-pressed="false"]{opacity:.55}
select.iconbtn{appearance:auto;padding:0 .4rem;font:inherit;font-size:.9rem;background:var(--surface);color:var(--text)}
.progress{height:4px;background:var(--surface2)}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.body{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0;min-width:0}
.app{width:100%;overflow:hidden;grid-template-columns:minmax(0,1fr)}
header>*{flex-shrink:0}
header h1{flex-shrink:1}
.short{display:none}
nav.toc{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:.6rem 0}
.toc h2{font-size:.78rem;letter-spacing:.04em;color:var(--muted);margin:.8rem 1rem .3rem;text-transform:uppercase}
.toc .ch{padding:.45rem 1rem;font-weight:650;font-size:.92rem}
.toc button.st{display:block;width:100%;text-align:left;border:0;background:none;padding:.35rem 1rem .35rem 1.6rem;font-size:.88rem;color:var(--muted);border-left:3px solid transparent}
.toc button.st.done{color:var(--text)}
.toc button.st.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.toc .gl{padding:.25rem 1rem;font-size:.86rem}
.toc .gl b{font-weight:650}
main{overflow:auto;min-height:0;padding:1rem}
.stage{max-width:980px;margin:0 auto;display:grid;gap:1rem}
.where{font-size:.82rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem}
.card h2{margin:.1rem 0 .6rem;font-size:1.25rem;line-height:1.35}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem;align-items:start}
.figure{background:var(--surface2);border-radius:12px;overflow:hidden;cursor:zoom-in;position:relative}
.figure img{display:block;width:100%;height:auto}
.figure .pg{position:absolute;right:.5rem;bottom:.5rem;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;padding:.1rem .45rem;border-radius:6px}
ul.points{margin:.2rem 0 .8rem;padding-left:1.2rem}
ul.points li{margin:.25rem 0}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:.6rem .8rem;margin:.6rem 0;font-size:.95rem}
.narr{font-size:1.02rem}
.narr span{border-radius:4px;transition:background .2s}
.narr span.now{background:var(--hl);color:var(--hl-ink)}
.refs{margin-top:.6rem;display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:.2rem .7rem;font-size:.84rem}
.quiz .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .8rem;margin:.45rem 0}
.quiz .opt.right{border-color:var(--ok);color:var(--ok);font-weight:600}
.quiz .opt.wrong{border-color:var(--bad);color:var(--bad)}
.quiz .explain{margin-top:.5rem;color:var(--muted)}
footer.ctrl{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem .8rem;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.big{height:48px;min-width:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.05rem;padding:0 1rem}
.play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:110px;font-weight:650}
.askbtn{background:var(--ask);color:var(--ask-ink);border-color:var(--ask);font-weight:650}
.counter{font-size:.82rem;color:var(--muted);min-width:4.5rem;text-align:center}
/* ask sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(760px,100%);height:min(82%,760px);
  background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);z-index:21;display:grid;grid-template-rows:auto 1fr auto;transition:transform .25s ease;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:translate(-50%,0)}
.scrim.open{display:block}
.sheet .head{padding:.8rem 1rem .5rem;border-bottom:1px solid var(--line)}
.sheet .head .row{display:flex;align-items:center;gap:.5rem}
.sheet .head b{flex:1}
.sheet .ctx{font-size:.8rem;color:var(--muted);margin-top:.2rem}
.chat{overflow:auto;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.6rem}
.msg{max-width:92%;padding:.55rem .8rem;border-radius:14px;white-space:normal;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.msg.a p{margin:.25rem 0}
.msg.a ul{margin:.25rem 0;padding-left:1.1rem}
.msg .pref{color:var(--accent);text-decoration:underline;cursor:pointer;border:0;background:none;padding:0}
.msg.note{align-self:center;background:none;color:var(--muted);font-size:.82rem;text-align:center}
.snip{border-left:3px solid var(--accent);padding-left:.6rem;margin:.4rem 0;font-size:.92rem}
.sheet .foot{border-top:1px solid var(--line);padding:.6rem .8rem;display:grid;gap:.5rem}
.sugs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.1rem}
.sugs button{flex:none}
.inrow{display:flex;gap:.5rem}
.inrow textarea{flex:1;resize:none;height:46px;max-height:120px;border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;background:var(--bg);color:var(--text);font:inherit}
.resume{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;height:44px;font-weight:650}
/* lightbox */
.lb{position:fixed;inset:0;background:#0b0b0b;z-index:30;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb.open{display:flex;flex-direction:column}
.lbbar{display:flex;align-items:center;gap:.35rem;padding:.45rem .6rem;color:#fff;flex:none}
.lbbar span{flex:1;font-size:.9rem;opacity:.85}
.lbbar button{min-width:42px;height:42px;border-radius:12px;border:1px solid #444;background:#1d1d1d;color:#fff;font-size:1.15rem}
.lbbar button:disabled{opacity:.35}
.lbview{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab}
.lbview.drag{cursor:grabbing}
.lbview img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;image-rendering:auto}
.lbhint{position:absolute;left:50%;bottom:.8rem;transform:translateX(-50%);background:rgba(255,255,255,.12);color:#fff;font-size:.8rem;padding:.3rem .7rem;border-radius:999px;pointer-events:none;transition:opacity .4s}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.45rem .9rem;border-radius:999px;font-size:.86rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:.95}
.menu-only{display:none}
body.bigslide .menu-only{display:inline-flex}
body.bigslide .body{grid-template-columns:minmax(0,1fr)}
body.bigslide nav.toc{position:fixed;top:0;bottom:0;left:0;width:min(86%,330px);z-index:25;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow);padding-top:calc(env(safe-area-inset-top,0px) + .6rem)}
body.bigslide nav.toc.open{transform:none}
body.bigslide .stage{max-width:1600px}
body.bigslide .split{grid-template-columns:minmax(0,2.3fr) minmax(300px,1fr)}
body.bigslide .figure{cursor:zoom-in;display:flex;justify-content:center}
body.bigslide .figure img{width:auto;max-width:100%;max-height:calc(100vh - 240px);max-height:calc(100dvh - 240px)}
@media (max-width:1100px){ body.bigslide .split{grid-template-columns:1fr} }
@media (max-width:860px){ body.bigslide main{padding:.4rem} body.bigslide .card.split{padding:.5rem;gap:.7rem} body.bigslide .card.split>div:last-child{padding:0 .4rem .4rem} }
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  .full{display:none}.short{display:inline}
  header{gap:.35rem;padding:.5rem .6rem}
  .iconbtn{min-width:38px;padding:0 .4rem}
  nav.toc{position:fixed;top:0;bottom:0;left:0;width:min(86%,330px);z-index:25;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow);padding-top:calc(env(safe-area-inset-top,0px) + .6rem)}
  nav.toc.open{transform:none}
  .menu-only{display:inline-flex}
  .split{grid-template-columns:1fr}
  main{padding:.7rem}
  .big{padding:0 .8rem}
  .play{min-width:92px}
  .counter{display:none}
  footer.ctrl{gap:.4rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div>
    <header>
      <button class="iconbtn menu-only" id="menuBtn" aria-label="menu">☰</button>
      <h1 id="title"></h1>
      <select class="iconbtn" id="langSel" aria-label="language" hidden></select>
      <button class="iconbtn" id="bigBtn" aria-pressed="false">🖼</button>
      <button class="iconbtn" id="voiceBtn" aria-pressed="true" title="voice">🔊</button>
      <button class="iconbtn" id="rateBtn" title="speed">1.0×</button>
    </header>
    <div class="progress"><i id="bar"></i></div>
  </div>
  <div class="body">
    <nav class="toc" id="toc"></nav>
    <main id="main"><div class="stage" id="stage"></div></main>
  </div>
  <footer class="ctrl">
    <button class="big" id="prevBtn" aria-label="previous">◀</button>
    <button class="big play" id="playBtn"></button>
    <button class="big" id="nextBtn" aria-label="next">▶</button>
    <span class="counter" id="counter"></span>
    <button class="big askbtn" id="askBtn"></button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="head">
    <div class="row"><b id="sheetTitle"></b><button class="iconbtn" id="closeSheet" aria-label="close">✕</button></div>
    <div class="ctx" id="sheetCtx"></div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="foot">
    <div class="sugs" id="sugs"></div>
    <div class="inrow">
      <textarea id="q" rows="1"></textarea>
      <button class="big play" id="sendBtn"></button>
    </div>
    <button class="resume" id="resumeBtn"></button>
  </div>
</section>
<div class="vpanel" id="vpanel" role="dialog">
  <h3 id="vTitle"></h3>
  <label class="row"><input type="checkbox" id="vOn"> <span id="vOnLbl"></span></label>
  <select id="voiceSel"></select>
  <div class="vrow"><button id="vTest"></button><button id="vClose">✕</button></div>
  <div class="tip" id="vTip" hidden></div>
</div>
<div class="lb" id="lb" role="dialog">
  <div class="lbbar"><span id="lbPg"></span>
    <button id="lbPrev" aria-label="previous page">‹</button><button id="lbNext" aria-label="next page">›</button>
    <button id="lbOut" aria-label="zoom out">−</button><button id="lbFit" aria-label="fit">⤢</button><button id="lbIn" aria-label="zoom in">+</button>
    <button id="lbClose" aria-label="close">✕</button></div>
  <div class="lbview" id="lbView"><img id="lbImg" alt="" draggable="false"><div class="lbhint" id="lbHint"></div></div>
</div>
<div class="toast" id="toast"></div>

  (s.match(/[a-z0-9][a-z0-9._\-]{1,}/g) || []).forEach(w => out.add(w));
  const cjk = s.replace(/[^\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]+/g, ' ').split(' ');
  cjk.forEach(seg => { for (let i = 0; i < seg.length - 1; i++) out.add(seg.slice(i, i+2)); if (seg.length === 1) out.add(seg); });
  return [...out];
}
function rank(q, extraPages){
  const ts = terms(q);
  return CHUNKS.map(c => {
    const low = c.text.toLowerCase(); let sc = 0;
    ts.forEach(w => { let k = 0, p = low.indexOf(w); while (p !== -1 && k < 20) { k++; p = low.indexOf(w, p+1); } sc += k ? (1 + Math.log(k)) * (w.length > 2 ? 1.5 : 1) : 0; });
    if (extraPages && extraPages.includes(c.page)) sc += 3;
    return {c, sc};
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc);
}

/* ---------- ask / interrupt ---------- */
let sample = null, aiState = 'pending', ctl = null, busy = false, wasPlaying = false, firstNoteShown = false;
const turns = [];
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('sample').then(fn => { sample = fn; aiState = fn ? 'ai' : 'local'; }).catch(() => { aiState = 'local'; });
} else { aiState = 'local'; }

$('sugs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) ask(b.textContent); });

function currentContext(){
  const f = FLAT[idx];
  if (f.kind === 'quiz') return {label: (f.ci+1) + '. ' + f.ch.title + ' · ' + S.quiz, text: f.quiz.map(q => q.q).join('\n'), pages: []};
  const st = f.st;
  const said = SENTS.slice(0, Math.max(sentIdx, 0) + 1).join(' ');
  return {label: (f.ci+1) + '. ' + f.ch.title + ' · ' + st.title,
          text: 'Step title: ' + st.title + '\nKey points: ' + (st.bullets||[]).join(' / ') + (st.warning ? '\nWarning: ' + st.warning : '') +
                '\nFull narration of this step: ' + st.narration + '\nThe learner interrupted right after hearing: "' + said + '"',
          pages: (st.page_refs||[]).concat(st.image ? [st.image] : [])};
}
function openAsk(){
  wasPlaying = playing; pause();
  const c = currentContext();
  $('sheetCtx').textContent = S.now + c.label;
  $('resumeBtn').textContent = wasPlaying ? S.resume : S.resumeIdle;
  $('scrim').classList.add('open'); $('sheet').classList.add('open');
  if (aiState !== 'local' && !firstNoteShown){ firstNoteShown = true; addMsg('note', esc(S.firstAsk)); }
  setTimeout(() => $('q').focus(), 260);
}
function closeAsk(resume){
  if (ctl) ctl.abort();
  $('scrim').classList.remove('open'); $('sheet').classList.remove('open');
  if (resume && wasPlaying){ toast(S.resumed); playing = true; updatePlay(); speakFrom(sentIdx); }
}
$('askBtn').onclick = openAsk;
$('closeSheet').onclick = () => closeAsk(false);
$('scrim').onclick = () => closeAsk(false);
$('resumeBtn').onclick = () => closeAsk(true);
$('sendBtn').onclick = () => { if (busy && ctl) { ctl.abort(); return; } ask($('q').value); };
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('sendBtn').click(); } });

function addMsg(kind, htmlStr){
  const d = document.createElement('div'); d.className = 'msg ' + kind; d.innerHTML = htmlStr;
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight; return d;
}
function md(s){
  const lines = esc(s).split('\n'); let out = '', inList = false;
  lines.forEach(line => {
    let l = line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m){ if (!inList){ out += '<ul>'; inList = true; } out += '<li>' + m[1] + '</li>'; }
    else { if (inList){ out += '</ul>'; inList = false; } if (l.trim()) out += '<p>' + l + '</p>'; }
  });
  if (inList) out += '</ul>';
  return out.replace(/\[\s*(?:p\.?|P\.?|page\s*|第|쪽\s*)?(\d{1,4})\s*(?:页|쪽)?\s*\]/g, (all, n) => IMG['p'+n] ? '<button class="pref" data-p="' + n + '">[' + esc(pageLabel(n)) + ']</button>' : all);
}
$('chat').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) openLB(+b.dataset.p); });

function buildPrompt(question){
  const c = currentContext();
  const outline = V.chapters.map((ch, i) => (i+1) + '. ' + ch.title + ': ' + ch.steps.map(s => s.title).join(' / ')).join('\n');
  let know = String(L.knowledge||'');
  const LIMIT = 150000;
  if (know.length > LIMIT){
    const picked = rank(question + ' ' + c.text, c.pages); let acc = '', used = new Set();
    for (const x of picked){ if (acc.length > LIMIT) break; if (used.has(x.c.page)) continue; used.add(x.c.page); acc += '[[p' + x.c.page + ']]\n' + x.c.text + '\n'; }
    know = '(Only the most relevant pages are included.)\n' + acc;
  }
  const hist = turns.slice(-8).map(m => (m.role === 'user' ? 'Learner: ' : 'Tutor: ') + m.content).join('\n\n');
  return [
    'You are a patient tutor who is in the middle of explaining a product/operation manual to a learner, using an explainer app. The learner just interrupted the lesson to ask something.',
    'Rules:',
    '- Answer in ' + LANG_NAME + ', conversationally, like a teacher speaking. Start with the direct answer. Usually 2-6 short sentences; use a short list only for procedures.',
    '- Base every factual claim on the MANUAL below. Cite pages as [p.N] right after the claim. If the manual does not say, say so plainly and, if helpful, give general advice clearly marked as general, not from the manual.',
    '- Safety-related warnings in the manual must never be softened.',
    '- Connect the answer to where the learner currently is in the lesson. Do not continue the lesson yourself; the learner will press Continue.',
    '- If the learner asks to repeat or simplify the current step, re-explain that step in fresh words.',
    '',
    'LESSON OUTLINE:\n' + outline,
    '',
    'WHERE THE LEARNER IS NOW:\n' + c.label + '\n' + c.text,
    '',
    'MANUAL (page markers look like [[pN]]):\n' + know,
    '',
    hist ? 'CONVERSATION SO FAR:\n' + hist + '\n' : '',
    'LEARNER\'S NEW QUESTION:\n' + question
  ].join('\n');
}

async function ask(question){
  question = String(question||'').trim(); if (!question || busy) return;
  $('q').value = '';
  addMsg('u', esc(question));
  if (aiState === 'pending'){ // runtime not answered yet: wait briefly
    for (let i = 0; i < 20 && aiState === 'pending'; i++) await new Promise(r => setTimeout(r, 250));
    if (aiState === 'pending') aiState = 'local';
  }
  if (aiState !== 'ai' || !sample){ localAnswer(question); return; }
  busy = true; $('sendBtn').textContent = S.stop;
  const bubble = addMsg('a', '<p>' + esc(S.thinking) + '</p>');
  ctl = new AbortController();
  try {
    const res = await sample(buildPrompt(question), {
      signal: ctl.signal, cache: false, modelTier: 'default',
      onText: ({text}) => { bubble.innerHTML = md(text); $('chat').scrollTop = $('chat').scrollHeight; }
    });
    bubble.innerHTML = md(res.text);
    turns.push({role:'user', content:question}, {role:'assistant', content:res.text});
  } catch(e) {
    const code = e && e.code;
    if (e && e.text) bubble.innerHTML = md(e.text); else bubble.remove();
    if (code === 'cancelled'){ /* user stopped */ }
    else if (code === 'not_granted'){ aiState = 'local'; addMsg('note', esc(S.denied)); localAnswer(question, true); }
    else if (code === 'rate_limited'){ addMsg('note', esc(S.limited)); }
    else { addMsg('note', esc(S.err)); }
  } finally { busy = false; ctl = null; $('sendBtn').textContent = S.send; }
}
function localAnswer(question, silentUser){
  const c = currentContext();
  const hits = rank(question, c.pages).slice(0, 3);
  if (!hits.length){ addMsg('a', '<p>' + esc(S.nohit) + '</p>'); return; }
  const ts = terms(question);
  const h = '<p>' + esc(S.offline) + '</p>' + hits.map(x => {
    const low = x.c.text.toLowerCase(); let pos = -1;
    for (const w of ts){ pos = low.indexOf(w); if (pos !== -1) break; }
    const start = Math.max(0, pos - 80), snip = (start ? '…' : '') + x.c.text.slice(start, start + 260) + (x.c.text.length > start + 260 ? '…' : '');
    const ref = x.c.page && IMG['p'+x.c.page] ? ' <button class="pref" data-p="' + x.c.page + '">[' + esc(pageLabel(x.c.page)) + ']</button>' : (x.c.page ? ' [' + esc(pageLabel(x.c.page)) + ']' : '');
    return '<div class="snip">' + esc(snip) + ref + '</div>';
  }).join('');
  addMsg('a', h);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const typing = /^(TEXTAREA|INPUT)$/.test(document.activeElement && document.activeElement.tagName);
  if ($('lb').classList.contains('open')){
    if (e.key === 'Escape') closeLB();
    else if (e.key === '+' || e.key === '=') lbZoomAt(1.5, ...lbCenter());
    else if (e.key === '-') lbZoomAt(1 / 1.5, ...lbCenter());
    else if (e.key === '0') lbFit();
    else if (e.key === 'ArrowLeft') lbStep(-1);
    else if (e.key === 'ArrowRight') lbStep(1);
    else return;
    e.preventDefault(); return;
  }
  if (e.key === 'Escape'){ if ($('sheet').classList.contains('open')) closeAsk(false); return; }
  if (typing || $('sheet').classList.contains('open')) return;
  if (e.key === ' '){ e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') go(idx+1, playing);
  else if (e.key === 'ArrowLeft') go(idx-1, playing);
  else if (e.key === 'q' || e.key === 'Q' || e.key === '?'){ e.preventDefault(); openAsk(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });

applyLabels();
if (hasTTS) pickVoice();
render();
})();
</script>
